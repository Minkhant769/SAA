<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Secret Space</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%); height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        .chat-container { width: 100%; max-width: 400px; height: 90vh; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        
        /* Setup Screen */
        #setup-screen { padding: 40px 20px; text-align: center; display: flex; flex-direction: column; justify-content: center; height: 100%; }
        h1 { color: #0284c7; font-size: 24px; margin-bottom: 20px; }
        .code-box { background: #f1f5f9; padding: 15px; border-radius: 10px; font-size: 20px; font-weight: bold; color: #334155; letter-spacing: 2px; margin-bottom: 30px; user-select: all; }
        input { padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; width: 100%; font-size: 16px; margin-bottom: 15px; outline: none; text-align: center; }
        input:focus { border-color: #0ea5e9; }
        button { background: #0ea5e9; color: white; border: none; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; width: 100%; }
        button:hover { background: #0284c7; }

        /* Chat Screen (Hidden initially) */
        #chat-screen { display: none; flex-direction: column; height: 100%; }
        .header { background: #0ea5e9; color: white; padding: 20px; text-align: center; font-weight: bold; font-size: 18px; }
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f8fafc; }
        .msg { padding: 12px 16px; border-radius: 15px; max-width: 80%; font-size: 15px; line-height: 1.4; }
        .msg.me { background: #0ea5e9; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.her { background: #e2e8f0; color: #1e293b; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg.system { background: transparent; color: #94a3b8; align-self: center; font-size: 12px; text-align: center; width: 100%;}
        
        .input-area { padding: 15px; background: white; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; }
        .input-area input { margin: 0; text-align: left; }
        .input-area button { width: 80px; background: #10b981; }
        .input-area button:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div id="setup-screen">
            <h1>Private P2P Chat</h1>
            <p style="color: #64748b; margin-bottom: 10px; font-size: 14px;">Your Secret Code (Send this to her):</p>
            <div class="code-box" id="my-code">Generating...</div>
            
            <p style="color: #64748b; margin-bottom: 10px; font-size: 14px;">Or enter her code here:</p>
            <input type="text" id="room-input" placeholder="Paste code here...">
            <button onclick="joinRoom()">Connect</button>
        </div>

        <div id="chat-screen">
            <div class="header">Secure Connection Active 🔒</div>
            <div class="messages" id="chat-box">
                <div class="msg system">Connected! Messages are not saved anywhere.</div>
            </div>
            <div class="input-area">
                <input type="text" id="msg-input" placeholder="Type a message..." onkeypress="handleEnter(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // Generate a random 5-letter code for easy sharing
        const mySecretId = Math.random().toString(36).substring(2, 7).toUpperCase();
        const peer = new Peer(mySecretId); 
        let conn;

        // When PeerJS is ready, show my code
        peer.on('open', function(id) {
            document.getElementById('my-code').textContent = id;
        });

        // If SHE connects to ME
        peer.on('connection', function(connection) {
            conn = connection;
            setupChat();
        });

        // If I connect to HER
        function joinRoom() {
            const partnerId = document.getElementById('room-input').value.trim().toUpperCase();
            if(!partnerId) return;
            conn = peer.connect(partnerId);
            conn.on('open', setupChat);
        }

        // Switch UI and listen for messages
        function setupChat() {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            
            conn.on('data', function(data) {
                addMessage(data, 'her');
            });

            conn.on('close', function() {
                addMessage("Your partner disconnected.", 'system');
            });
        }

        // Send a message
        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (text === '') return;
            
            conn.send(text);
            addMessage(text, 'me');
            input.value = '';
        }

        // Press Enter to send
        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // Add message bubble to the screen
        function addMessage(text, senderType) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg ' + senderType;
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll to bottom
        }

        peer.on('error', function(err) {
            alert('Connection Error: Make sure the code is correct!');
        });
    </script>

</body>
</html>
